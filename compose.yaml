name: eta-heiz-kontroller
x-app: &app
  image: eta-heiz-kontroller:local
  env_file: .env
  volumes:
    - eta-data:/data
    - ./backups:/backups
    - ./.secrets:/run/secrets:ro
  restart: unless-stopped
services:
  init:
    <<: *app
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py bootstrap && python manage.py collectstatic --noinput"
    restart: "no"
  web:
    <<: *app
    ports: ["127.0.0.1:8098:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: python manage.py worker
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  eta-data:
