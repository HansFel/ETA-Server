## EMQX auf der NAS (ETA-Heiz-Kontroller und eigene Aufgaben).
## Werte hier haben Vorrang vor Änderungen im Dashboard. Benutzer und eigene Regeln pflegst du im Dashboard
## (Zugriffskontrolle), die ETA-Regeln stehen fest in acl.conf.

node {
  name = "emqx@127.0.0.1"
  cookie = "${EMQX_NODE_COOKIE}"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

## 1883: Heimnetz und Docker-Netz "mqtt", ohne TLS, mit Passwort. Im Router NICHT freigeben.
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1000
}

## 8883: TLS, im Router freigegeben.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1000
  ssl_options {
    cacertfile = "/opt/emqx/etc/nas-certs/ca.crt"
    certfile = "/opt/emqx/etc/nas-certs/server.crt"
    keyfile = "/opt/emqx/etc/nas-certs/server.key"
    verify = verify_none
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

## Websockets werden nicht gebraucht.
listeners.ws.default.enable = false
listeners.wss.default.enable = false

## Nur Konten mit Passwort; Anonyme werden abgewiesen.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = pbkdf2, mac_fun = sha256, iterations = 4096 }
    ## Legt beim ersten Start das Konto der ETA-App an (weitere Konten im Dashboard).
    bootstrap_file = "/opt/emqx/etc/secrets/users.csv"
    bootstrap_type = plain
  }
]

## Erst die festen Regeln (acl.conf), dann die Regeln aus dem Dashboard. Was nirgends erlaubt ist, ist verboten.
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = true, max_size = 32, ttl = 1m }
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
    { type = built_in_database, enable = true }
  ]
}

dashboard.listeners.http.bind = 18083
