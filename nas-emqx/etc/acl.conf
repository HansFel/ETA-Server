%% Feste Zugriffsregeln. Reihenfolge zählt: die erste passende Regel gilt.
%% ${username} = MQTT-Benutzer. Eigene Aufgaben bekommen ihre Regeln im Dashboard
%% (Zugriffskontrolle -> Autorisierung -> Built-in Database), NICHT als Superuser.

%% --- Beobachter (z. B. MQTT Explorer): darf alles mitlesen, aber nichts senden ---
{allow, {username, {re, "^explorer$"}}, subscribe, ["#", "$SYS/#"]}.
{deny, {username, {re, "^explorer$"}}, publish, ["#"]}.

%% --- ETA-Heiz-Kontroller ---
%% App-Brücke: einziges Konto mit Zugriff auf alle eta/-Topics.
{allow, {username, {re, "^eta-app$"}}, all, ["eta/#"]}.
{allow, {username, {re, "^eta-app$"}}, subscribe, ["etaio/+/sensors"]}.

%% Geräte/Aufgaben, die ETA-Punkte schalten: nur unter dem eigenen Namen.
%% Ob tatsächlich geschaltet werden darf, entscheidet die App (Konto mit Häkchen "MQTT-Gerät").
{allow, all, publish, ["eta/dev/${username}/cmd/+/set"]}.
{allow, all, subscribe, ["eta/dev/${username}/cmd/+/result", "eta/dev/${username}/state/#"]}.
{allow, all, all, ["eta/dev/${username}/status/#"]}.
{allow, all, publish, ["eta/wiesenegger/${username}/status/#", "eta/wiesenegger/${username}/telemetry", "eta/wiesenegger/${username}/event"]}.
{allow, all, subscribe, ["eta/wiesenegger/${username}/command/#"]}.
{allow, all, subscribe, ["eta/app/availability"]}.
%% Alle Heizungsdaten: jedes Konto darf lesen, nur eta-app schreibt.
{allow, all, subscribe, ["eta/state/#", "eta/status", "eta/errors"]}.

%% Eigene Topics eines ESP32 (ETA IO): Zustände, Sensoren, Ausgänge (etaio/<benutzer>/ioN/set) und
%% Home-Assistant-Discovery. Andere Konten (Node-RED, Home Assistant) bekommen etaio/# im Dashboard.
{allow, all, all, ["etaio/${username}/#"]}.
{allow, all, publish, ["homeassistant/+/${username}/#"]}.
{allow, all, subscribe, ["homeassistant/status"]}.

%% Alles andere unter eta/ ist gesperrt, auch wenn das Dashboard mehr erlaubt (verhindert vorgetäuschte Geräte).
{deny, all, all, ["eta/#"]}.

%% --- Allgemein ---
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.
